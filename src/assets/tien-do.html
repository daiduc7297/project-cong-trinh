async function shareFile(fn,data){
 try{const f=new File([data],fn,{type:'application/json'});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:fn});return}}catch(e){if(e&&e.name=='AbortError')return}
 try{const d=await claude.use('downloads');if(d){await d.save({filename:fn,data});return}}catch(e){if(e&&e.code=='declined')return}
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'application/json'}));a.download=fn;a.click()}
const slug=t=>String(t||'du_an').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/đ/gi,'d').replace(/[^\w\-]+/g,'_').replace(/^_+|_+$/g,'');

 Object.keys(S.done||{}).forEach(k=>{const a=S.done[k];if(Array.isArray(a)&&a.length){up.done[k]=a;if((S.dd||{})[k])up.dd[k]=S.dd[k]}});
 shareFile('Cap_nhat_'+slug(S.info.name)+'_'+ymd(d)+'.json',JSON.stringify(up));stat('Update file created')}

 Object.keys(up.done||{}).forEach(k=>{const dd=(up.dd||{})[k]||{};(up.done[k]||[]).forEach(id=>{
  if(ids&&!ids.has(id)){r.skip++;return}
  const had=(S.done[k]||[]).includes(id),a=ddOf(k,id),b=dd[id]!=null?dd[id]:null;
  if(!had){setTick(k,id,true,b);r.tick++}
  else if(b!=null&&(a==null||b<a)){S.dd[k]=S.dd[k]||{};S.dd[k][id]=b;r.date++}})});
 (up.pl||[]).forEach(x=>{const n=String((x&&x.n)||'').trim().toLowerCase(),ex=(S.pl||[]).find(y=>String(y.n).trim().toLowerCase()==n);if(ex&&+x.d>(+ex.d||0)){r.pile+=Math.min(+x.d,+ex.t||1e12)-(+ex.d||0);ex.d=Math.min(+x.d,+ex.t||1e12)}});
 (up.piles||[]).forEach((arr,z)=>{if(!Array.isArray(arr))return;S.piles=S.piles||[];S.piles[z]=S.piles[z]||[];const A=S.piles[z];
  arr.forEach(x=>{const n=String((x&&x[0])||'').trim();if(!n)return;const d=x[1]||'',ex=A.find(y=>String(y[0]).trim().toLowerCase()==n.toLowerCase());
   if(!ex){A.push([n,d]);r.pile++}else if(d&&(!ex[1]||d<ex[1])){ex[1]=d;r.pdate++}})});
 return r}

function vSave(){try{localStorage.setItem('tdw_v',JSON.stringify({ld:V.ld,lq:V.lq,hd:V.hd,hl:V.hl,hb:V.hb}))}catch(e){}}
$('#tgh').onclick=()=>{V.hd=!V.hd;vSave();render()};
$('#pba').onclick=()=>{if(!canWrite()||ROLE==='member')return;snap();S.info.auto=!(S.info.auto!==false);rdAuto();save();render()};
$('#tgl').onclick=()=>{V.hl=!V.hl;vSave();render()};
$('#tgb').onclick=()=>{V.hb=!V.hb;vSave();render()};
try{const p=JSON.parse(localStorage.getItem('tdw_v')||'{}');if(p.ld||p.lq||p.hd||p.hl||p.hb){Object.assign(V,p);render()}}catch(e){}
/* ================= Nhân công hằng ngày + thời tiết + xu hướng tuần ================= */
/* S.daily = { ngày: {w: số công nhân, wx: 0 bình thường | 1 mưa một phần | 2 mưa dừng thi công, n: ghi chú} }
   S.wk    = { thứ Hai đầu tuần: {pa, pp, fin, w (TB công nhân/ngày), r1, r2} } — tự chốt khi bấm Save
   S.hideRes = true → ẩn biểu đồ kỹ sư + máy móc dưới Gantt (cả màn hình và PDF) */
const DY_WX=['Normal','Rain – partly','Rain – stopped work'],DY_IC=['','🌧','⛈'];
const dyToday=()=>{const t=new Date();return Date.UTC(t.getFullYear(),t.getMonth(),t.getDate())/864e5};
const dyIso=d=>new Date(d*864e5).toISOString().slice(0,10);
const dyParse=s=>{const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s||'');return m?Date.UTC(+m[1],+m[2]-1,+m[3])/864e5:null};
const dyWork=d=>{try{const k=DI(d);return k!=null&&ID(k)===d}catch(e){return false}};
const dyAct=d=>{const x=(S.daily||{})[d];return x&&x.w!=null&&x.w!==''?+x.w:null};
const mpPct=x=>x==null||!isFinite(x)?'–':Math.round(x*100)+'%';
/* công nhân kế hoạch theo ngày = tổng nguồn lực loại "Công nhân" của các công tác */
function mpPlan(c){const u=U0(c),cd=kres('W').map(r=>r.code),m={};for(let q=0;q<u.N;q++){let s=0;cd.forEach(x=>{if(u.U[x])s+=u.U[x][q]});if(s)m[ID(u.k0+q)]=s}return m}
function mpData(c){const rd=S.info.status,P=mpPlan(c),pl=d=>P[d]||0;
 const W=wkList().map(w=>{let p=0,a=0,n=0,miss=0;for(let d=w.a;d<=w.b&&d<=rd;d++){const x=dyAct(d);p+=pl(d);if(x!=null){a+=x;n++}else if(dyWork(d))miss++}
  let lab=false;if(!n){let lb=null;kres('W').forEach(r=>{const v=((S.lab||{})[r.code]||{})[w.a];if(v!=null)lb=(lb||0)+(+v||0)});if(lb!=null){a=lb;lab=true;miss=0}}
  return{a:w.a,b:w.b,p,act:n||lab?a:null,miss,lab}});
 let lp=0,la=0,r1=0,r2=0,r1t=0,r2t=0;
 for(let d=rd-27;d<=rd;d++){const x=dyAct(d);if(x!=null){la+=x;lp+=pl(d)}}
 Object.entries(S.daily||{}).forEach(([k,v])=>{k=+k;if(k>rd||!v)return;if(v.wx==1){r1t++;if(k>rd-28)r1++}if(v.wx==2){r2t++;if(k>rd-28)r2++}});
 const Lr=lp>0?la/lp:null,SPI=c.pp>0?c.pa/c.pp:null;
 let vd=null;if(Lr!=null&&SPI!=null){if(SPI>=.95)vd=['ok','On track',Lr<.9?`Progress at ${mpPct(SPI)} of plan with only ${mpPct(Lr)} of planned workers.`:`Progress at ${mpPct(SPI)} of plan, workers at ${mpPct(Lr)} of plan.`];
  else if(Lr<.9)vd=['bad','Manpower shortage',`Workers at ${mpPct(Lr)} of plan (last 4 weeks) and progress at ${mpPct(SPI)} of plan → more workers needed.`];
  else vd=['warn','Low productivity',`Workers at ${mpPct(Lr)} of plan but progress only ${mpPct(SPI)} of plan → check work fronts, materials, site organisation.`]}
 /* số công nhân/ngày cần từ nay để kịp ngày kết thúc kế hoạch */
 let fc=null;const fut=Object.keys(P).map(Number).filter(d=>d>rd);
 if(Lr!=null&&SPI!=null&&fut.length&&c.pa<1&&c.pp<1){const end=Math.max(...fut);let Mr=0,nd=0;for(let d=rd+1;d<=end;d++){Mr+=pl(d);if(dyWork(d))nd++}
  const E=SPI/Lr;if(nd&&Mr){fc=E<.5||E>2?{end,plan:Mr/nd,need:null}:{end,plan:Mr/nd,need:Mr*((1-c.pa)/(1-c.pp))/E/nd}}}
 return{rd,P,pl,W,lp,la,Lr,SPI,vd,fc,r1,r2,r1t,r2t}}
function mpChart(M,N=30,W=900){const sm=W<600,rd=M.rd,d0=rd-N+1,H=sm?300:250,L=sm?30:40,R=sm?6:12,T=sm?52:30,B=34,days=[];for(let d=d0;d<=rd;d++)days.push(d);
 const mx=Math.max(10,...days.map(d=>Math.max(M.pl(d),dyAct(d)||0)))*1.15,bw=(W-L-R)/N,X=i=>L+i*bw,Y=v=>H-B-v/mx*(H-T-B);
 let o=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block;background:#fff;border:1px solid #cbd5e1;border-radius:8px;color:#0f172a"><text x="${L}" y="18" font-size="13" font-weight="bold">Workers per day – last ${N} days</text>`;
 const st=Math.pow(10,Math.floor(Math.log10(mx/4)));const step=[1,2,5,10].map(k=>k*st).find(s=>mx/s<=6)||st*10;
 for(let v=0;v<=mx;v+=step)o+=`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="#e2e8f0"/><text x="${L-5}" y="${Y(v)+4}" font-size="10" text-anchor="end" fill="#475569">${v}</text>`;
 let pts='';days.forEach((d,i)=>{const a=dyAct(d),p=M.pl(d),x=X(i),wd=dyWork(d),e=(S.daily||{})[d]||{};
  if(a!=null){const low=p>0&&a<.8*p;o+=`<rect x="${x+bw*.15}" y="${Y(a)}" width="${bw*.7}" height="${H-B-Y(a)}" fill="${low?'#dc2626':'#2563eb'}"><title>${fd(d)}: ${a} workers (plan ${Math.round(p)})</title></rect>`}
  else if(wd&&d<=rd)o+=`<rect x="${x+bw*.15}" y="${H-B-14}" width="${bw*.7}" height="14" fill="#e2e8f0"><title>${fd(d)}: not entered</title></rect>`;
  if(e.wx)o+=`<text x="${x+bw/2}" y="${(a!=null?Y(a):H-B-14)-4}" font-size="12" text-anchor="middle">${DY_IC[e.wx]}</text>`;
  pts+=`${x},${Y(p)} ${x+bw},${Y(p)} `;
  if(i%(sm?3:5)==0||i==N-1)o+=`<text x="${x+bw/2}" y="${H-B+14}" font-size="10" text-anchor="middle" fill="#475569">${fd(d).slice(0,5)}</text>`});
 o+=`<polyline points="${pts}" fill="none" stroke="#f59e0b" stroke-width="2.5"/>`;
 const lg=sm?[['#f59e0b','Planned','l'],['#2563eb','Actual','r'],['#dc2626','< 80%','r'],['#e2e8f0','Not entered','r']]:[['#f59e0b','Planned','l'],['#2563eb','Actual','r'],['#dc2626','Below 80% of plan','r'],['#e2e8f0','Not entered','r']];let lx=sm?L:W-R-560;const ly=sm?36:14;
 lg.forEach(([cl,t,k])=>{o+=k=='l'?`<line x1="${lx}" x2="${lx+18}" y1="${ly}" y2="${ly}" stroke="${cl}" stroke-width="3"/>`:`<rect x="${lx}" y="${ly-6}" width="14" height="12" fill="${cl}"/>`;o+=`<text x="${lx+22}" y="${ly+4}" font-size="11">${t}</text>`;lx+=t.length*6.2+(sm?30:40)});
 if(!sm)o+=`<text x="${lx}" y="18" font-size="11">🌧 rain partly · ⛈ stopped</text>`;
 return o+'</svg>'}
function mpVerdict(M){if(!M.vd)return`<p style="color:var(--mut)">Enter daily workers (＋ Daily) to compare with the plan.</p>`;const[k,t,s]=M.vd,cl=k=='ok'?'#16a34a':k=='bad'?'#dc2626':'#d97706';
 return`<div style="border-left:5px solid ${cl};background:var(--card);padding:6px 10px;margin:6px 0;border-radius:4px"><b style="color:${cl}">${t}</b> – ${s}</div>`}
function mpFc(M){if(M.fc&&M.fc.need==null)return`<p style="margin:6px 0;color:var(--mut)">Workers needed per day cannot be forecast reliably: progress and workers differ too much from the plan – check that task % / ticked units are up to date.</p>`;return M.fc?`<p style="margin:6px 0"><b>Need ~${Math.round(M.fc.need)} workers/day</b> from now to finish by ${fd(M.fc.end)} (plan average: ${Math.round(M.fc.plan)}/day; based on productivity achieved so far).</p>`:''}
function mpSection(c){const M=mpData(c),d5=d=>fd(d).slice(0,5);
 const rows=M.W.map((w,i)=>{const r=w.act!=null&&w.p?w.act/w.p:null,low=r!=null&&r<.8;return`<tr><td>${i==3?'Report wk':'Wk −'+(3-i)}<br>${d5(w.a)}–${d5(w.b)}</td><td>${w.p?nf(Math.round(w.p)):'–'}</td><td>${w.act!=null?nf(w.act)+(w.lab?' *':''):'–'}</td><td${low?' style="color:#dc2626;font-weight:700"':''}>${mpPct(r)}</td><td>${w.miss||''}</td></tr>`}).join('');
 return`<h3>C. MANPOWER – PLANNED vs ACTUAL (WORKERS)</h3>${mpVerdict(M)}${mpFc(M)}
 <table class="pt rt rfx"><colgroup><col style="width:28%"><col style="width:18%"><col style="width:18%"><col style="width:18%"><col style="width:18%"></colgroup><tr><th>Week</th><th>Planned man-days</th><th>Actual man-days</th><th>Actual / Plan</th><th>Working days not entered</th></tr>${rows}</table>
 ${M.W.some(w=>w.lab)?'<p style="color:var(--mut);font-size:11px;margin:2px 0">* weekly total entered before daily input</p>':''}
 <div style="margin:8px 0">${mpChart(M)}</div>
 <p style="margin:4px 0">Rain days – last 4 weeks: <b>${M.r1}</b> partly, <b>${M.r2}</b> stopped work · since start: <b>${M.r1t}</b> partly, <b>${M.r2t}</b> stopped work.</p>`}
function trendRows(){return Object.entries(S.wk||{}).map(([k,v])=>({d:+k,...v})).sort((a,b)=>a.d-b.d).slice(-8)}
function trendSection(){const T=trendRows(),d5=d=>fd(d).slice(0,5);
 if(!T.length)return`<h3>D. WEEKLY TREND</h3><p style="color:var(--mut)">No weekly data yet – it is recorded automatically each time you press Save.</p>`;
 return`<h3>D. WEEKLY TREND</h3><table class="pt rt rfx"><tr><th>Week</th><th>Planned %</th><th>Actual %</th><th>Actual / Plan</th><th>Forecast finish</th><th>Avg workers/day</th><th>Rain days (partly / stopped)</th></tr>${T.map((t,i)=>{const ix=t.pp?t.pa/t.pp:null,pv=i?T[i-1]:null,pix=pv&&pv.pp?pv.pa/pv.pp:null,ar=ix!=null&&pix!=null?(ix>pix+.005?' <span style="color:#16a34a">▲</span>':ix<pix-.005?' <span style="color:#dc2626">▼</span>':''):'';
  return`<tr><td>${d5(t.d)}–${d5(t.d+6)}</td><td>${(t.pp*100).toFixed(1)}%</td><td>${(t.pa*100).toFixed(1)}%</td><td${ix!=null&&ix<.95?' style="color:#dc2626;font-weight:700"':''}>${ix!=null?ix.toFixed(2):'–'}${ar}</td><td>${fd(t.fin)}</td><td>${t.w!=null?t.w:'–'}</td><td>${t.r1||0} / ${t.r2||0}</td></tr>`}).join('')}</table>`}
function mpMobile(c){const M=mpData(c),rd=M.rd,a=dyAct(rd),p=M.pl(rd),wk=M.W[3],pw=M.W[2];
 const kp=[['Workers today',a!=null?a:'–'],['Plan today',p?Math.round(p):'–'],['Last week',pw&&pw.p&&pw.act!=null?mpPct(pw.act/pw.p):'–',pw&&pw.p&&pw.act!=null&&pw.act/pw.p<.8?'bad':''],['This week',wk&&wk.p&&wk.act!=null?mpPct(wk.act/wk.p):'–',wk&&wk.p&&wk.act!=null&&wk.act/wk.p<.8?'bad':''],['Rain (4 wks)',M.r1+M.r2],['Stopped (4 wks)',M.r2,M.r2?'bad':'']];
 const T=trendRows().slice(-4);
 return`<h4>Manpower (workers)</h4><div class="mvk">${kp.map(([k,v,b])=>`<div class="${b||''}"><span>${k}</span><b>${v}</b></div>`).join('')}</div>${mpVerdict(M)}${mpFc(M)}${mpChart(M,14,420)}<div style="font-size:11px;color:var(--mut)">🌧 rain partly · ⛈ stopped work</div>`+
  (T.length?`<h4>Weekly trend</h4><table class="pt" style="width:100%"><tr><th>Week</th><th>Actual</th><th>Plan</th><th>Index</th></tr>${T.map(t=>`<tr><td>${fd(t.d).slice(0,5)}</td><td>${(t.pa*100).toFixed(1)}%</td><td>${(t.pp*100).toFixed(1)}%</td><td>${t.pp?(t.pa/t.pp).toFixed(2):'–'}</td></tr>`).join('')}</table>`:'')}
/* chốt số liệu tuần — gọi khi người dùng bấm Save */
function wkSnap(){try{if(!canWriteFull())return;const c=compute();if(c.err&&c.err.length)return;const rd=S.info.status,k=wkStart(rd);let n=0,s=0,r1=0,r2=0;
 for(let d=k;d<=k+6&&d<=rd;d++){const x=(S.daily||{})[d];if(!x)continue;if(x.w!=null&&x.w!==''){s+=+x.w;n++}if(x.wx==1)r1++;if(x.wx==2)r2++}
 const o={pa:+(+c.pa).toFixed(4),pp:+(+c.pp).toFixed(4),fin:c.pFin,w:n?Math.round(s/n):null,r1,r2};S.wk=S.wk||{};
 if(JSON.stringify(S.wk[k])===JSON.stringify(o))return;S.wk[k]=o;DIRTY=true}catch(e){}}
/* hộp nhập "Daily update" */
function dyDlg(d0){if(!CUR||!canWriteFull())return;let d=d0||dyToday();const box=document.createElement('div');box.id='dyb';box.style.cssText='position:fixed;inset:0;background:#0007;z-index:99;display:flex;align-items:center;justify-content:center';
 let pc=null;try{const c=compute();if(!c.err.length)pc=mpPlan(c)}catch(e){}
 const close=()=>{box.remove();document.removeEventListener('keydown',esc0)},esc0=e=>{if(e.key==='Escape')close()};
 const draw=()=>{const D=S.daily||{},e=D[d]||{},t0=dyToday(),wx=+e.wx||0;
  const chips=[];for(let x=t0-6;x<=t0;x++){const v=D[x];chips.push(`<button data-dyday="${x}" style="padding:2px 6px;${x==d?'outline:2px solid var(--ac);':''}">${fd(x).slice(0,5)} <b>${v&&v.w!=null&&v.w!==''?v.w:'–'}</b>${v&&v.wx?DY_IC[v.wx]:''}</button>`)}
  box.innerHTML=`<div class="dlg" style="background:var(--card,#fff);color:var(--fg,#000);border:1px solid var(--bd,#999);border-radius:10px;padding:14px;width:340px;max-width:94vw;display:flex;flex-direction:column;gap:10px">
  <b>Daily update – ${esc(S.info.name)}</b>
  <label style="display:flex;justify-content:space-between;align-items:center;gap:10px">Date <input type="date" id="dyd" value="${dyIso(d)}"></label>
  <label style="display:flex;justify-content:space-between;align-items:center;gap:10px">Workers <input type="number" id="dyw" min="0" step="1" inputmode="numeric" value="${e.w!=null?e.w:''}" style="width:110px;font-size:16px"></label>
  <div style="font-size:12px;color:var(--mut)">Planned workers this day: <b>${pc&&pc[d]?Math.round(pc[d]):'–'}</b>${dyWork(d)?'':' · non-working day'}</div>
  <div style="display:flex;flex-direction:column;gap:4px">Weather${DY_WX.map((t,i)=>`<label style="display:flex;gap:6px;align-items:center;justify-content:flex-start"><input type="radio" name="dyx" value="${i}"${i==wx?' checked':''}> ${t} ${DY_IC[i]}</label>`).join('')}</div>
  <label style="display:flex;justify-content:space-between;align-items:center;gap:10px">Note <input id="dyn" value="${esc(e.n||'')}" style="flex:1"></label>
  <div style="display:flex;gap:6px;align-items:center"><button id="dyc">Copy yesterday</button><span style="flex:1"></span><button id="dyq">Cancel</button><button id="dys" class="on" style="font-weight:700">Save</button></div>
  <div style="font-size:12px;color:var(--mut)">Last 7 days (tap to edit):</div><div style="display:flex;flex-wrap:wrap;gap:4px">${chips.join('')}</div></div>`;
  box.querySelector('#dyd').onchange=ev=>{const v=dyParse(ev.target.value);if(v!=null){d=v;draw()}};
  box.querySelector('#dyq').onclick=close;
  box.querySelector('#dyc').onclick=()=>{const k=Object.keys(D).map(Number).filter(x=>x<d&&D[x]&&D[x].w!=null&&D[x].w!=='').sort((a,b)=>b-a)[0];if(k!=null)box.querySelector('#dyw').value=D[k].w;else stat('No earlier entry to copy')};
  box.querySelectorAll('[data-dyday]').forEach(b=>b.onclick=()=>{d=+b.dataset.dyday;draw()});
  box.querySelector('#dys').onclick=()=>{const wv=box.querySelector('#dyw').value.trim(),w=wv===''?null:Math.max(0,Math.round(+wv)),x=+(box.querySelector('input[name=dyx]:checked')||{}).value||0,n=box.querySelector('#dyn').value.trim();
   if(wv!==''&&!isFinite(+wv)){stat('Workers must be a number');return}
   snap();S.daily=S.daily||{};if(w==null&&!x&&!n)delete S.daily[d];else S.daily[d]={w,wx:x,n};save();close();render();saveNow()};
  setTimeout(()=>{const i=box.querySelector('#dyw');if(i)i.focus()},30)};
 draw();document.body.appendChild(box);document.addEventListener('keydown',esc0);box.addEventListener('click',ev=>{if(ev.target===box)close()})}
$('#dly').onclick=()=>dyDlg();
$('#tgr').onclick=()=>{if(!canWriteFull())return;snap();S.hideRes=!S.hideRes;save();render()};
</script></body></html>
