  snap();const a=S.piles[z],ex=a.find(x=>String(x[0]).trim().toLowerCase()==n.toLowerCase());if(ex){if(d)ex[1]=d}else a.push([n,d]);save();render();setTimeout(()=>{const el=document.getElementById('qn'+z);if(el)el.focus()},0)}});

/* ---- gửi / nhập cập nhật hiện trường ---- */
async function shareFile(fn,data){
 try{const f=new File([data],fn,{type:'application/json'});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:fn});return}}catch(e){if(e&&e.name=='AbortError')return}
 try{const d=await claude.use('downloads');if(d){await d.save({filename:fn,data});return}}catch(e){if(e&&e.code=='declined')return}
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'application/json'}));a.download=fn;a.click()}
const slug=t=>String(t||'du_an').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/đ/gi,'d').replace(/[^\w\-]+/g,'_').replace(/^_+|_+$/g,'');
function sendUpdate(){const d=dayNow(),up={kind:'td-update',v:1,pj:S.info.name,pid:CUR,date:d,done:{},dd:{},piles:S.piles||[]};
 Object.keys(S.done||{}).forEach(k=>{const a=S.done[k];if(Array.isArray(a)&&a.length){up.done[k]=a;if((S.dd||{})[k])up.dd[k]=S.dd[k]}});
 shareFile('Cap_nhat_'+slug(S.info.name)+'_'+ymd(d)+'.json',JSON.stringify(up));stat('Đã tạo file cập nhật')}
function mergeUpdate(up){const r={tick:0,date:0,pile:0,pdate:0,skip:0},ids=isG()?new Set(gU().map(u=>u.id)):null;S.done=S.done||{};S.dd=S.dd||{};
 Object.keys(up.done||{}).forEach(k=>{const dd=(up.dd||{})[k]||{};(up.done[k]||[]).forEach(id=>{
  if(ids&&!ids.has(id)){r.skip++;return}
  const had=(S.done[k]||[]).includes(id),a=ddOf(k,id),b=dd[id]!=null?dd[id]:null;
  if(!had){setTick(k,id,true,b);r.tick++}
  else if(b!=null&&(a==null||b<a)){S.dd[k]=S.dd[k]||{};S.dd[k][id]=b;r.date++}})});
 (up.piles||[]).forEach((arr,z)=>{if(!Array.isArray(arr))return;S.piles=S.piles||[];S.piles[z]=S.piles[z]||[];const A=S.piles[z];
  arr.forEach(x=>{const n=String((x&&x[0])||'').trim();if(!n)return;const d=x[1]||'',ex=A.find(y=>String(y[0]).trim().toLowerCase()==n.toLowerCase());
   if(!ex){A.push([n,d]);r.pile++}else if(d&&(!ex[1]||d<ex[1])){ex[1]=d;r.pdate++}})});
 return r}
function importUpdate(){if(!canWriteFull()){stat('Chỉ xem');return}const f=document.createElement('input');f.type='file';f.accept='.json,application/json';
 f.onchange=async()=>{try{const up=JSON.parse(await f.files[0].text());if(!up||up.kind!='td-update')throw new Error('Đây không phải file “Gửi cập nhật” từ hiện trường');
  if(up.pid&&up.pid!=CUR&&ALL[up.pid]&&!confirm('File này thuộc dự án “'+ALL[up.pid].name+'”.\nChuyển sang dự án đó rồi gộp?'))return;
  if(up.pid&&up.pid!=CUR&&ALL[up.pid]){save();loadProj(up.pid)}
  else if(!confirm('Gộp cập nhật “'+(up.pj||'')+'” ('+fd(up.date)+') vào dự án “'+S.info.name+'”?'))return;
  snap();const r=mergeUpdate(up);save();render();
  const m='Đã gộp: +'+r.tick+' căn tô mới'+(r.date?', '+r.date+' căn sửa sang ngày sớm hơn':'')+', +'+r.pile+' cọc mới'+(r.pdate?', '+r.pdate+' cọc cập nhật ngày':'')+(r.skip?'. Bỏ qua '+r.skip+' căn không có trong mặt bằng này':'')+'.';stat(m);alert(m)}
  catch(e){alert('Lỗi nhập cập nhật: '+e.message)}};f.click()}
document.getElementById('su').onclick=sendUpdate;document.getElementById('iu').onclick=importUpdate;

boot();

/* ---- kéo chuột để tô nhiều căn ---- */
(function(){
 const unitAt=(x,y)=>{const el=document.elementFromPoint(x,y),g=el&&el.closest&&el.closest('#sv g[data-u]');return g?g.dataset.u:null};
 const paint=id=>{setTick(DRG.k,id,DRG.mode);
  const g=[...document.querySelectorAll('#sv g[data-u]')].find(x=>x.dataset.u===id),pg=g&&g.querySelector('polygon');if(pg)pg.classList.toggle('on',DRG.mode)};
 const finish=()=>{if(!DRG)return;const d=DRG;DRG=null;if(d.moved){SWALLOW=true;setTimeout(()=>{SWALLOW=false},50);save();render()}};
 document.addEventListener('mousedown',e=>{
  if(e.button!==0||!canWrite()||!isG()||V.tab!=2||(V.tool&&V.tool!='tick'))return;
  const id=unitAt(e.clientX,e.clientY);if(!id)return;e.preventDefault();
  const k=S.W?'w'+(V.gw||0):'t'+S.R[V.gs].id;
  DRG={k,mode:!(S.done[k]||[]).includes(id),start:id,last:id,moved:false,px:e.clientX,py:e.clientY}});
 document.addEventListener('mousemove',e=>{
  if(!DRG)return;if(e.buttons===0){finish();return}
  const dx=e.clientX-DRG.px,dy=e.clientY-DRG.py,n=Math.max(1,Math.ceil(Math.hypot(dx,dy)/3));
  for(let i=1;i<=n;i++){const id=unitAt(DRG.px+dx*i/n,DRG.py+dy*i/n);if(!id||id===DRG.last)continue;
   if(!DRG.moved){DRG.moved=true;snap();paint(DRG.start)}
   paint(id);DRG.last=id}
  DRG.px=e.clientX;DRG.py=e.clientY});
 document.addEventListener('mouseup',finish);
 document.addEventListener('touchstart',e=>{const w=e.target.closest&&e.target.closest('#gwrap');if(!w||!isG()||V.tab!=2)return;
  if(e.touches.length>=2){if(DRG&&DRG.touch){if(DRG.moved){save()}DRG=null}const a=e.touches[0],b=e.touches[1];PIN={d:Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY)||1,z:curZoom(),mx:(a.clientX+b.clientX)/2,my:(a.clientY+b.clientY)/2};e.preventDefault();return}
  if(e.touches.length==1&&V.multi&&canWrite()&&(!V.tool||V.tool=='tick')){const t=e.touches[0],id=unitAt(t.clientX,t.clientY);e.preventDefault();if(!id)return;const k=S.W?'w'+(V.gw||0):'t'+S.R[V.gs].id;DRG={k,mode:!(S.done[k]||[]).includes(id),start:id,last:id,moved:false,touch:1,px:t.clientX,py:t.clientY}}},{passive:false});
 document.addEventListener('touchmove',e=>{
  if(PIN&&e.touches.length>=2){e.preventDefault();const a=e.touches[0],b=e.touches[1],mx=(a.clientX+b.clientX)/2,my=(a.clientY+b.clientY)/2,w=document.getElementById('gwrap');if(!w)return;w.scrollLeft+=PIN.mx-mx;w.scrollTop+=PIN.my-my;setZoom(PIN.z*Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY)/PIN.d,mx,my);PIN.mx=mx;PIN.my=my;return}
  if(DRG&&DRG.touch&&e.touches.length==1){e.preventDefault();const t=e.touches[0],dx=t.clientX-DRG.px,dy=t.clientY-DRG.py,n=Math.max(1,Math.ceil(Math.hypot(dx,dy)/3));
   for(let i=1;i<=n;i++){const id=unitAt(DRG.px+dx*i/n,DRG.py+dy*i/n);if(!id||id===DRG.last)continue;if(!DRG.moved){DRG.moved=true;snap();paint(DRG.start)}paint(id);DRG.last=id}
   DRG.px=t.clientX;DRG.py=t.clientY}},{passive:false});
 document.addEventListener('touchend',e=>{if(PIN&&e.touches.length<2)PIN=null;if(!DRG||!DRG.touch||e.touches.length)return;const d=DRG;DRG=null;if(d.moved){save();render()}else{snap();setTick(d.k,d.start,d.mode);save();render()}});
 document.addEventListener('touchcancel',()=>{PIN=null;if(DRG&&DRG.touch){const d=DRG;DRG=null;if(d.moved){save();render()}}});
})();

/* ---- chia màn hình bảng / đường tiến độ (V13) ---- */
var LWK='tdw_lw';function getLW(){try{return +localStorage.getItem(LWK)||0}catch(e){return 0}}function setLW(v){try{v?localStorage.setItem(LWK,Math.round(v)):localStorage.removeItem(LWK)}catch(e){}}
function splitInfo(){const sp=document.querySelector('.split'),lp=document.getElementById('lp'),tb=lp&&lp.querySelector('table.t');if(!sp||!tb)return null;const sbw=lp.offsetWidth-lp.clientWidth,nat=Math.ceil(tb.offsetWidth)+sbw+2,tot=sp.clientWidth-7;return{sp,lp,nat:Math.max(nat,240),max:Math.max(240,tot-150)}}
function layoutSplit(){const I=splitInfo();if(!I)return;const u=getLW();let w=u?Math.min(I.nat,I.max,Math.max(120,u)):Math.min(I.nat,I.max,Math.round((I.sp.clientWidth-7)*.58));document.getElementById('lw').style.width=w+'px';syncTop()}
function syncTop(){[['lp','lt'],['rp','rt']].forEach(([p,t])=>{const P=document.getElementById(p),T=document.getElementById(t);if(!P||!T)return;T.firstChild.style.width=(T.clientWidth+P.scrollWidth-P.clientWidth)+'px';T.style.visibility=P.scrollWidth>P.clientWidth+1?'visible':'hidden';T.scrollLeft=P.scrollLeft})}
var GDR=null;
document.addEventListener('mousedown',e=>{if(e.target.id!=='gut'||e.button!==0)return;const lw=document.getElementById('lw');GDR={x:e.clientX,w:lw.offsetWidth};e.target.classList.add('dr');e.preventDefault()});
document.addEventListener('mousemove',e=>{if(!GDR)return;if(e.buttons===0){endGut();return}const I=splitInfo();if(!I)return;const w=Math.max(120,Math.min(I.nat,I.max,GDR.w+e.clientX-GDR.x));document.getElementById('lw').style.width=w+'px';GDR.cur=w;syncTop()});
function endGut(){if(!GDR)return;const g=document.getElementById('gut');if(g)g.classList.remove('dr');if(GDR.cur)setLW(GDR.cur);GDR=null}
document.addEventListener('mouseup',endGut);
document.addEventListener('dblclick',e=>{if(e.target.id==='gut'){setLW(0);layoutSplit()}});
window.addEventListener('resize',()=>{if(V.tab==1)layoutSplit()});

/* ---- baseline nhiều lần + nhãn Gantt (V15) ---- */
var BC=['#64748b','#f59e0b','#10b981','#a855f7','#ec4899','#0ea5e9'];
function blMig(){if(!S.bls){S.bls=[];const m={};let n=0;(S.R||[]).forEach(r=>{if(r.bs&&r.bf){m[r.id]=[r.bs,r.bf];n++}});if(n)S.bls.push({n:1,d:0,t:'Baseline gốc',m})}}
function blIdx(){const L=S.bls||[];return V.bv!=null&&L[V.bv]?V.bv:L.length-1}
function BL(r){const L=S.bls||[],k=blIdx();if(k<0)return null;if(k===L.length-1)return r.bs&&r.bf?{s:r.bs,f:r.bf}:null;const a=L[k].m[r.id];return a?{s:a[0],f:a[1]}:null}
function blH(t){const L=S.bls||[],k=blIdx();if(k<0||k===L.length-1)return t;const n=L[k].n;return t.replace('Lệch BL<br>BL variance','Lệch BL'+n+'<br>vs BL'+n).replace('Bắt đầu gốc<br>Baseline start','Bắt đầu BL'+n+'<br>BL'+n+' start').replace('Kết thúc gốc<br>Baseline finish','Kết thúc BL'+n+'<br>BL'+n+' finish')}
function blCell(r,w,inp){const L=S.bls||[];if(blIdx()>=L.length-1)return r.sum?fd(w?r.bf:r.bs):inp(w?'af':'as',fd(w?r.bf:r.bs),'d');const b=BL(r);return b?fd(w?b.f:b.s):''}
function blVar(r,i,c){const b=BL(r);if(!b||!b.f)return'';const v=DI(c.fn[i])-DI(b.f);return`<span style="color:${v>0?'#dc2626':v<0?'#16a34a':'inherit'}">${v>0?'+'+v:v}</span>`}
function d5(d){const t=new Date(d*864e5);return String(t.getUTCDate()).padStart(2,'0')+'/'+String(t.getUTCMonth()+1).padStart(2,'0')}
function blSnapLast(){const L=S.bls||[];if(!L.length)return;const m={};S.R.forEach(r=>{if(r.bs&&r.bf)m[r.id]=[r.bs,r.bf]});L[L.length-1].m=m}
function blSync(){const L=S.bls||[],e=L[L.length-1];S.R.forEach(r=>{const a=e&&e.m[r.id];r.bs=a?a[0]:0;r.bf=a?a[1]:0})}
function copyBL(){cal();const c=compute();if(c.err.length)return;if(!confirm('Chép toàn bộ Start/Finish hiện tại vào Baseline mới? Baseline cũ được cất vào lịch sử, không mất.'))return;snap();blMig();blSnapLast();const L=S.bls,m={};S.R.forEach((r,i)=>{r.bs=c.sd[i];r.bf=c.fn[i];m[r.id]=[c.sd[i],c.fn[i]]});L.push({n:(L.length?L[L.length-1].n:0)+1,d:Math.floor((Date.now()-new Date().getTimezoneOffset()*6e4)/864e5),t:'',m});V.bv=null;save();render();stat('Đã chép tiến độ thành Baseline '+L[L.length-1].n)}
function blUI(){const s=document.getElementById('bsel');if(!s)return;const L=S.bls||[];s.innerHTML=L.length?L.map((e,j)=>`<option value="${j}">BL${e.n}${j==L.length-1?' (mới nhất)':''}${e.t?' – '+esc(e.t):''}</option>`).join(''):'<option>Chưa có baseline</option>';if(L.length)s.value=blIdx();[['tgd','ld','Ẩn ngày','Hiện ngày'],['tgq','lq','Ẩn số lượng','Hiện số lượng'],['tgh','hd','Hiện việc đã xong','Ẩn việc đã xong']].forEach(([i,k,a,b])=>{const e=document.getElementById(i);e.classList.toggle('on',!!V[k]);e.textContent=V[k]?a:b})}
function blMgr(){blMig();const L=S.bls,d=document.createElement('div');d.style.cssText='position:fixed;inset:0;background:#0007;z-index:99;display:flex;align-items:center;justify-content:center';
 const draw=()=>{d.innerHTML=`<div style="background:var(--card,#fff);color:var(--fg,#000);border:1px solid var(--bd,#999);border-radius:10px;padding:14px;min-width:420px;max-width:92vw"><b>Quản lý baseline</b><div style="margin:8px 0">${L.length?L.map((e,j)=>`<div style="display:flex;gap:6px;align-items:center;margin:4px 0"><span style="width:10px;height:10px;background:${j==L.length-1?'#64748b':BC[j%BC.length]}"></span><b>BL${e.n}</b><input data-bn="${j}" value="${esc(e.t||'')}" placeholder="Ghi chú" style="flex:1"><small>${e.d?fd(e.d):'—'}</small><label title="Chồng lên Gantt"><input type="checkbox" data-bo="${j}" ${(V.bo||[]).includes(j)?'checked':''}>chồng</label><button data-bd="${j}">Xoá</button></div>`).join(''):'Chưa có baseline nào.'}</div><div style="text-align:right"><button id="bmx">Đóng</button></div></div>`};
 draw();document.body.appendChild(d);
 d.onclick=e=>{const t=e.target;if(t.id==='bmx'||t===d){d.remove();render();return}if(t.dataset.bd!=null){const j=+t.dataset.bd;if(!confirm('Xoá baseline BL'+L[j].n+'?'))return;snap();blSnapLast();L.splice(j,1);V.bo=(V.bo||[]).filter(x=>x!==j).map(x=>x>j?x-1:x);V.bv=null;blSync();save();draw()}};
 d.onchange=e=>{const t=e.target;if(t.dataset.bn!=null){L[+t.dataset.bn].t=t.value;save()}if(t.dataset.bo!=null){const j=+t.dataset.bo,a=new Set(V.bo||[]);t.checked?a.add(j):a.delete(j);V.bo=[...a];save()}}}
$('#bl').onclick=copyBL;$('#bm').onclick=blMgr;
$('#bsel').onchange=e=>{const L=S.bls||[],j=+e.target.value;V.bv=j>=L.length-1?null:j;render()};
$('#tgd').onclick=()=>{V.ld=!V.ld;vSave();render()};$('#tgq').onclick=()=>{V.lq=!V.lq;vSave();render()};

function visPos(c){let k=0;const P=S.R.map((r,i)=>V.hd&&c.pc[i]>=.9999?-1:k++);P.n=k;return P}
function vSave(){try{localStorage.setItem('tdw_v',JSON.stringify({ld:V.ld,lq:V.lq,hd:V.hd}))}catch(e){}}
$('#tgh').onclick=()=>{V.hd=!V.hd;vSave();render()};
try{const p=JSON.parse(localStorage.getItem('tdw_v')||'{}');if(p.ld||p.lq||p.hd){Object.assign(V,p);render()}}catch(e){}
